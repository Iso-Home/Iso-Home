name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    name: Model smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run check-model (all plans + save round trip)
        run: node check-model.js
