name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    name: Model smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run smoke test + export validation
        run: npm test
